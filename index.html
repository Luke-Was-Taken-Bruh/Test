<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NormalOS™</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="desktop">
  <div class="desktop-icon" ondblclick="openApp('explorer')"><b>📁</b><span>This PC</span></div>
  <div class="desktop-icon" ondblclick="openApp('notepad')"><b>📝</b><span>Notepad</span></div>
  <div class="desktop-icon" ondblclick="openApp('calculator')"><b>🧮</b><span>Calculator</span></div>
  <div class="desktop-icon" ondblclick="openApp('settings')"><b>⚙️</b><span>Settings</span></div>
  <div class="desktop-icon"><b>🗑️</b><span>Recycle Bin</span></div>
</div>

<div id="start-menu">
  <div class="start-head">NormalOS™</div>
  <input id="search" placeholder="Search" oninput="searchApps(this.value)">
  <div id="search-results"></div>
  <button onclick="openApp('explorer')">📁 File Explorer</button>
  <button onclick="openApp('notepad')">📝 Notepad</button>
  <button onclick="openApp('calculator')">🧮 Calculator</button>
  <button onclick="openApp('settings')">⚙️ Settings</button>
  <button onclick="shutdown()">⏻ Shut down</button>
</div>

<div id="taskbar">
  <button id="start-btn" onclick="toggleStart()">⊙ Start</button>
  <div id="tasks"></div>
  <div class="tray"><span>🌐</span><span>🔊</span><span id="clock"></span></div>
</div>

<div id="windows"></div>
<script src="os.js"></script>
</body></html>
